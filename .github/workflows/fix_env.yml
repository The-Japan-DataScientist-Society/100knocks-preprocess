name: fix environment.yml and pyproject.toml

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  fix_env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Get Python version
        id: get_python_version
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: |
          docker compose up -d --wait
          version="$(docker compose exec notebook python --version | sed -e 's/Python //g')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2001
          echo "minor_version=$(echo "$version" | sed -e 's/\([0-9]*\.[0-9]*\).*/\1/g')" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        with:
          python-version: ${{ steps.get_python_version.outputs.version }}
          enable-cache: true
      - uses: flatt-security/setup-takumi-guard-pypi@a01b3b2a6436d3df60d4e29c805ad83a704aadc5 # v1.3.0
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
      - if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: yq -i ".project.requires-python|=\"==$PYTHON_VERSION\"" pyproject.toml
        env:
          PYTHON_VERSION: ${{ steps.get_python_version.outputs.version }}
      - name: Install
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: uv sync
      - name: Copy packages from pyproject.toml to environment.yml
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: |
          sed -i -e "s/ python=.*/ python=${PYTHON_VERSION}/g" environment.yml
          installed_packages="$(uv pip freeze)"
          for package_name in $(yq -p toml -o yaml '.project.dependencies[]' pyproject.toml | sed -e 's/[=<>!~ ].*//g')
          do
            if ! grep "$package_name" environment.yml
            then
              echo "$package_name is not exit in environment.yml." 1>&2
              exit 1
            fi

            # uv pip freezeはパッケージ名を正規化して出力するため、バージョンのみ取り出す
            package="$package_name==$(echo "$installed_packages" | grep -i "^$package_name==" | sed -e 's/.*==//g')"
            sed -i -e "s/ $package_name==[0-9.]*$/ $package/g" environment.yml
            sed -i -e "s/ $package_name=[0-9.]*$/ ${package//==/=}/g" environment.yml
          done
        env:
          PYTHON_VERSION: ${{ steps.get_python_version.outputs.minor_version }}
      - uses: dev-hato/actions-diff-pr-management@ac5ddb8fbc4e36f31ef0f90ded9488c0305055e6 # v2.3.0
        if: success() || failure()
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          branch-name-prefix: fix-env
          pr-title-prefix: environment.ymlやpyproject.toml修正
